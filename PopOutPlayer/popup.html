<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PopOut Player</title>
    <style>
        body {
            width: 220px;
            text-align: center;
            font-family: "Poppins", Arial, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            padding: 15px;
            border-radius: 10px;
        }

        h3 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        button {
            background-color: #ff6b81;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }

        button:hover {
            background-color: #ff4757;
        }

        .footer {
            margin-top: 10px;
            font-size: 12px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <h3>🎬 PopOut Player</h3>
    <button id="pipButton">Activate PiP Mode</button>
    <div class="footer">by <b>Janhvi</b> 🚀</div>
    <script src="popup.js"></script>
</body>
</html>
